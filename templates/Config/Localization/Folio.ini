; Gather configuration for the Folio localization target: the UI's text, and nothing else.
;
; Deliberately its own target rather than part of the game's. The UI's strings then have their own
; manifest, archives, Folio.po and Folio.locres, so what goes to a translator is one file holding
; exactly the screens - not a PO with every C++ string and asset in the project mixed into it. A
; translator can be given the UI without being given the game.
;
; THIS FILE IS AUTHORITATIVE AND HAND-WRITTEN. Do not use the Localization Dashboard to change gather
; settings: it keeps its own copy and regenerates this file from them, silently dropping anything it
; does not know about - which here is the one directory that matters. Use the Dashboard for the
; Translation Editor only.
;
; Two things have to be set up alongside this file, and neither is optional:
;
;   1. Config/DefaultGame.ini needs the target loaded at runtime, or nothing resolves:
;        [Internationalization]
;        +LocalizationPaths=%GAMEDIR%Content/Localization/Folio
;
;   2. The game's own target must exclude the generated header, or its strings are gathered twice:
;        ExcludePathFilters=Source/Generated/*
;
; Run Plugins/Folio/scripts/loc.ps1 rather than gathering directly. GatherTextFromSource cannot read
; markup, so the script has to write Source/Generated/FolioText.h first. See Plugins/Folio/NOTES.md.

[CommonSettings]
SourcePath=Content/Localization/Folio
DestinationPath=Content/Localization/Folio
ManifestName=Folio.manifest
ArchiveName=Folio.archive
PortableObjectName=Folio.po
NativeCulture=en
CulturesToGenerate=en

;Gather the generated declarations, and nothing else. Narrow on purpose: this target is the UI's text,
;so pointing it at Source/ wholesale would pull in every C++ string the game target already owns.
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/Generated/
FileNameFilters=*.h
ShouldGatherFromEditorOnlyData=false

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import translated PO files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Folio.locres
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource
ResourceName=Folio.locres

;Export Folio.po, which is the file a translator receives
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
