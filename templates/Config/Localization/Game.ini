; Gather configuration for the Game localization target.
;
; THIS FILE IS AUTHORITATIVE AND HAND-WRITTEN. Do not use the Localization Dashboard to change gather
; settings: the Dashboard stores its own settings elsewhere and regenerates this file from them, which
; silently drops anything it does not know about - including Source/Generated below. Use the Dashboard
; for the Translation Editor only.
;
; Folio's user-visible text lives in .rml documents, which GatherTextFromSource cannot read. Run
; Plugins/Folio/Tools/locgather/gather_rml.py before gathering; it writes Source/Generated/FolioText.h,
; a header nothing includes, holding one NSLOCTEXT per data-loc key so the ordinary source pass finds
; them. See Plugins/Folio/NOTES.md.

[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
NativeCulture=en
CulturesToGenerate=en

;Gather text from source code, including the generated header holding the markup's strings
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/
SearchDirectoryPaths=Plugins/
SearchDirectoryPaths=Config/
ExcludePathFilters=Config/Localization/*
ExcludePathFilters=Plugins/Folio/build/*
ExcludePathFilters=Plugins/Folio/Tools/*
ExcludePathFilters=Plugins/*/Intermediate/*
ExcludePathFilters=*/ThirdParty/*
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.inl
FileNameFilters=*.ini
ShouldGatherFromEditorOnlyData=false

;Gather text from assets
[GatherTextStep1]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/*
ExcludePathFilters=Content/Localization/*
ExcludePathFilters=Content/Developers/*
ExcludePathFilters=Content/Editor/*
PackageFileNameFilters=*.umap
PackageFileNameFilters=*.uasset
bFixBroken=false
ShouldGatherFromEditorOnlyData=false

;Write Manifest
[GatherTextStep2]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep3]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import localized PO files
[GatherTextStep4]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep5]
CommandletClass=GenerateTextLocalizationResource
ResourceName=Game.locres

;Export PO files
[GatherTextStep6]
CommandletClass=InternationalizationExport
bExportLoc=true
